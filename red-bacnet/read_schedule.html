<script type="text/javascript">
    RED.nodes.registerType('read schedule', {
        category: 'redbacnet',
        color: '#b5e6ff',
        defaults: {
            name: { value: "" },
            client: { type: "bacnet client", required: true },
            maxConcurrentDeviceRead: { value: 1, required: true, validate: RED.validators.number() },
            concurrentTaskDelay: { value: 50, required: true, validate: RED.validators.number() },
            emitError: { value: true },
        },
        inputs: 1,
        outputs: 1,
        icon: "hal-systems.png",

        label: function () {
            return this.name || "read schedule";
        }
    });
</script>

<script type="text/html" data-template-name="read schedule">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-client"><i class="fa fa-tag"></i> Client</label>
        <input type="text" id="node-input-client">
    </div>
    <div class="form-row">
        <label for="node-input-maxConcurrentDeviceRead"><i class="fa fa-tag"></i> Max Concurrent Device Read</label>
        <input type="number" id="node-input-maxConcurrentDeviceRead" placeholder="1" , min="1" , max="1000">
    </div>
    <div class="form-row">
        <label for="node-input-concurrentTaskDelay"><i class="fa fa-tag"></i> Concurrent Task Delay (ms)</label>
        <input type="number" id="node-input-concurrentTaskDelay" placeholder="50" , min="0" , max="10000">
    </div>
    <div class="form-row">
        <label for="node-input-emitError"><i class="fa fa-tag"></i> Emit Error</label>
        <input type="checkbox" id="node-input-emitError" checked style="display: inline-block; width: auto; vertical-align: top;">
    </div>
</script>

<script type="text/html" data-help-name="read schedule">
    <p>Read BACnet schedules (present value, effective period, default value, weekly and exception schedules)</p>

    <h3>Config</h3>
        <dl class="message-properties">
            <dt>client<span class="property-type">string</span></dt>
            <dd> BACnet Client</dd>

            <dt>maxConcurrentDeviceRead<span class="property-type">number</span></dt>
            <dd> Devices count to read simultaneously.</dd>
            <dd> <b> USE WITH CAUTION!</b> Reduce to low value on a slow network</dd>

            <dt>concurrentTaskDelay<span class="property-type">number</span></dt>
            <dd> Delay in milliseconds between reading different devices</dd>
            <dd> <b>USE WITH CAUTION!</b> Increase value on slow or congested networks</dd>

            <dt>emitError<span class="property-type">boolean</span></dt>
            <dd> If checked, errors are reported via <code>node.error</code> (debug pane & console). Uncheck to suppress error reporting. Default to <code>true</code></dd>
        </dl>

    <h3>Inputs</h3>
        <dl class="message-properties">
            <dt>msg.devices <span class="property-type">array</span></dt>
            <dd> A list of devices generated from discover device node (modify values if required)</dd>

            <dt>msg.points <span class="property-type">array</span></dt>
            <dd> A list of points generated from discover point node. Use <b>Schedule Only</b> discover mode. Only schedule objects are read.</dd>

            <dt class="optional">msg.id <span class="property-type">string | number</span></dt>
            <dd> Job ID. Default to <code>readSchedules</code> if not provided.</dd>

            <dt class="optional">msg.priority <span class="property-type">number</span></dt>
            <dd> Job priority in queue. Default to <code>3</code> if not provided.</dd>
        </dl>

    <h3>Outputs</h3>
        <dl class="message-properties">
            <dt>msg.payload <span class="property-type">array</span></dt>
            <dd>Schedules. Each item contains <code>presentValue</code>, <code>effectivePeriod</code>, <code>scheduleDefault</code>, <code>weeklySchedule</code> and <code>exceptionSchedule</code>, with a matching <code>*Error</code> field if that property failed to read.</dd>
        </dl>

    <h3>Details</h3>
        <p>If node is triggered while existing job is running, new job will be coalesced if <code>msg.id</code> are identical, else new job will be put in queue until current job is completed.</p>
</script>
